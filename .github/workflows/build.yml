name: Build

# Builds CLAP, VST3 and Standalone for Windows, macOS (universal) and Linux.
# Every run uploads the plugins as artifacts; pushing a tag like v2.1.0 also publishes a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels the older, unfinished build
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            slug: windows
            configure: ""
          - name: macOS
            os: macos-latest
            slug: macos
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          - name: Linux
            os: ubuntu-22.04
            slug: linux
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release

    steps:
      - uses: actions/checkout@v4

      # Only the submodules the build needs (mi-eurorack is reference material)
      - name: Fetch JUCE and clap-juce-extensions
        shell: bash
        run: git submodule update --init --recursive --depth 1 juce clap-juce-extensions

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: cmake -B build ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel --target Mutadrums_CLAP Mutadrums_VST3 Mutadrums_Standalone

      - name: Package
        shell: bash
        run: |
          art=build/Mutadrums_artefacts/Release
          out=Mutadrums-${{ matrix.slug }}
          mkdir -p "$out"
          cp -R "$art/CLAP/Mutadrums.clap" "$out/"
          cp -R "$art/VST3/Mutadrums.vst3" "$out/"
          case "${{ runner.os }}" in
            Windows) cp "$art/Standalone/Mutadrums.exe" "$out/" ;;
            macOS)   cp -R "$art/Standalone/Mutadrums.app" "$out/" ;;
            Linux)   cp "$art/Standalone/Mutadrums" "$out/" ;;
          esac
          cp LICENSE "$out/LICENSE.txt"
          cp docs/install.txt "$out/INSTALL.txt"
          ls -la "$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mutadrums-${{ matrix.slug }}
          path: Mutadrums-${{ matrix.slug }}

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "Mutadrums-${{ github.ref_name }}-${{ matrix.slug }}.zip" "Mutadrums-${{ matrix.slug }}"
          else
            # ditto/zip keep macOS bundle symlinks and permissions intact
            zip -ry "Mutadrums-${{ github.ref_name }}-${{ matrix.slug }}.zip" "Mutadrums-${{ matrix.slug }}"
          fi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Mutadrums-${{ github.ref_name }}-${{ matrix.slug }}.zip
          generate_release_notes: true
